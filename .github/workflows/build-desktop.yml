name: Build Desktop App

# Builds a real Windows installer and publishes it to GitHub Releases.
# Trigger manually from the Actions tab, or push a tag like v2.0.0.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish to an existing release tag (e.g. v2.0.5)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow pywebview pythonnet

      - name: Generate application icon
        run: python scripts/make_icon.py

      # v2.3: 自动布线工具（Freerouting jar + Java 25）体积大，不入库，CI 现下。
      # 用 ghproxy 镜像规避 GitHub Releases 直连限速；失败则退回直连。
      - name: Download autorouting tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools/freerouting, tools/java25 | Out-Null
          function Get-WithMirror($url, $dst) {
            $mirrors = @(
              "https://ghfast.top/$url",
              "https://ghproxy.net/$url",
              $url
            )
            foreach ($m in $mirrors) {
              try {
                Invoke-WebRequest -Uri $m -OutFile $dst -TimeoutSec 300
                if ((Get-Item $dst).Length -gt 1MB) { return }
              } catch { Write-Host "mirror failed: $m" }
            }
            throw "download failed: $url"
          }
          Get-WithMirror "https://github.com/freerouting/freerouting/releases/download/v2.5.0/freerouting-2.5.0.jar" "tools/freerouting/freerouting-2.5.0.jar"
          Get-WithMirror "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jre_x64_windows_hotspot_25.0.5_8.zip" "tools/java25/jre25.zip"
          Expand-Archive -Path tools/java25/jre25.zip -DestinationPath tools/java25 -Force
          python -m pip install --target tools/pylibs/kipy kicad-python --no-deps -q
          python -m pip install --target tools/pylibs/kipy "protobuf<6,>=5.29" "pynng<0.10,>=0.9" jsonschema -q

      - name: Build portable executable
        run: python -m PyInstaller --clean -y packaging/eda_agent_desktop.spec

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/installer | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "installer\EDA-Agent.iss"
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          } else {
            Write-Host "::warning::ISCC.exe not found - installer step skipped, portable exe still built."
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EDA-Agent-Windows
          path: |
            dist/EDA-Agent.exe
            dist/installer/*.exe
          if-no-files-found: warn
          retention-days: 30

      # Use gh CLI with --clobber so re-runs can overwrite an existing asset
      # (e.g. a portable exe published earlier) instead of failing with 422.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          gh release view $tag | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "EDA Agent $tag - Desktop" --generate-notes
          }
          gh release upload $tag dist/EDA-Agent.exe --clobber
          $setup = Get-ChildItem dist/installer/*.exe -ErrorAction SilentlyContinue
          if ($setup) {
            foreach ($f in $setup) { gh release upload $tag $f.FullName --clobber }
          }
          gh release view $tag --json assets --jq '.assets[].name'
