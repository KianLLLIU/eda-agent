name: Build Desktop App

# Builds a real Windows installer and publishes it to GitHub Releases.
# Trigger manually from the Actions tab, or push a tag like v2.0.0.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish to an existing release tag (e.g. v2.0.4)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow pywebview pythonnet

      - name: Generate application icon
        run: python scripts/make_icon.py

      - name: Build portable executable
        run: python -m PyInstaller --clean -y packaging/eda_agent_desktop.spec

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/installer | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "installer\EDA-Agent.iss"
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          } else {
            Write-Host "::warning::ISCC.exe not found - installer step skipped, portable exe still built."
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EDA-Agent-Windows
          path: |
            dist/EDA-Agent.exe
            dist/installer/*.exe
          if-no-files-found: warn
          retention-days: 30

      # Use gh CLI with --clobber so re-runs can overwrite an existing asset
      # (e.g. a portable exe published earlier) instead of failing with 422.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          gh release view $tag | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "EDA Agent $tag - Desktop" --generate-notes
          }
          gh release upload $tag dist/EDA-Agent.exe --clobber
          $setup = Get-ChildItem dist/installer/*.exe -ErrorAction SilentlyContinue
          if ($setup) {
            foreach ($f in $setup) { gh release upload $tag $f.FullName --clobber }
          }
          gh release view $tag --json assets --jq '.assets[].name'
